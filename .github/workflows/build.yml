name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      hdt-version:
        description: HDT release tag to build against (for example v1.55.6). Empty = latest.
        required: false
        default: ''

# Read-only by default; only the release job may write, and only on a tag.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    env:
      ContinuousIntegrationBuild: 'true'   # read by MSBuild: deterministic paths, warnings as errors
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The plugin compiles against HearthstoneDeckTracker.exe, which is not on NuGet.
      # Use HDT's official release zip from HearthSim's GitHub.
      - name: Download Hearthstone Deck Tracker
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HDT_TAG: ${{ inputs.hdt-version }}
        run: |
          $repo = 'HearthSim/Hearthstone-Deck-Tracker'
          $tag = $env:HDT_TAG
          if (-not $tag) { $tag = gh release view --repo $repo --json tagName --jq .tagName }
          if ($tag -notmatch '^v\d+(\.\d+){1,3}$') { throw "Unexpected HDT tag '$tag'" }

          $zipDir = Join-Path $env:RUNNER_TEMP 'hdt-zip'
          $hdtDir = Join-Path $env:RUNNER_TEMP 'hdt'
          gh release download $tag --repo $repo --pattern 'Hearthstone.Deck.Tracker-*.zip' --dir $zipDir
          if ($LASTEXITCODE -ne 0) { throw "Could not download HDT $tag" }
          Get-ChildItem $zipDir -Filter *.zip | ForEach-Object { Expand-Archive -LiteralPath $_.FullName -DestinationPath $hdtDir }

          # Pick the managed assembly (skips a native launcher stub, if the zip ever has one).
          $exe = Get-ChildItem $hdtDir -Recurse -Filter HearthstoneDeckTracker.exe | Where-Object {
            try { [Reflection.AssemblyName]::GetAssemblyName($_.FullName) | Out-Null; $true } catch { $false }
          } | Select-Object -First 1
          if (-not $exe) { throw 'HearthstoneDeckTracker.exe not found in the HDT release zip' }

          "HDT_PATH=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          "HDT_TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Building against HDT $tag"

      - name: Build, check and package
        shell: pwsh
        run: ./build.ps1 -HdtPath $env:HDT_PATH -SkipInstall -Package

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $dll = Get-Item artifacts/MyReconnectorPlugin.dll
          $version = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version.ToString(3)
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
          }

      - name: Summary
        shell: pwsh
        run: |
          "### MyReconnectorPlugin" >> $env:GITHUB_STEP_SUMMARY
          "Built against HDT **$env:HDT_TAG**" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content artifacts/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          "HDT_TAG=$env:HDT_TAG" >> artifacts/build-info.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MyReconnectorPlugin
          path: artifacts/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MyReconnectorPlugin
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          hdt_tag=$(sed -n 's/^HDT_TAG=//p' artifacts/build-info.txt)

          # Release notes = this version's section of CHANGELOG.md.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for [$version]" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo "Built by GitHub Actions against HDT ${hdt_tag}. **Install:** extract the zip into HDT's Plugins folder, run HDT as administrator, enable *My Reconnector*. Verify the download against \`SHA256SUMS.txt\`."
          } >> notes.md

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            artifacts/MyReconnectorPlugin-v*.zip \
            artifacts/MyReconnectorPlugin.dll \
            artifacts/SHA256SUMS.txt
